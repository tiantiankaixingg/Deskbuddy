[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv

upload_speed = 921600
monitor_speed = 115200

; Display driver: LovyanGFX, configured in include/LGFX_config.hpp
; User_Setup.h at the repo root is only for the Arduino IDE snapshot
; (desk_buddy_github.cpp), which still uses TFT_eSPI

lib_deps =
    lovyan03/LovyanGFX @ ^1.1.16
    bblanchon/ArduinoJson @ ^7.3.0
